version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jellyfin-custom
    ports:
      - "${LISTEN_PORT}:${LISTEN_PORT}"
    env_file: .env
    environment:
      - LISTEN_PORT
      - LISTEN_IP
      - DB_HOST=db
    volumes:
      - jellyfin-config:/config
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: app-db
    restart: unless-stopped
    env_file: .env
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  jellyfin-config:
  postgres-data:
